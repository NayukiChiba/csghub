name: ${COMPOSE_PROJECT_NAME:-csghub-dev}

services:
  postgres:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/postgres:15.18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: starhub_server,csghub_casdoor,starhub_portal
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.max_background_workers=32
    ports:
      - "127.0.0.1:${CSGHUB_DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starhub_server"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - csghub-dev

  redis:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/redis:7.2.5
    ports:
      - "127.0.0.1:${CSGHUB_DEV_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - csghub-dev

  minio:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/bitnami/minio:2023
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Password_123
      MINIO_SCHEME: http
      MINIO_REGION_NAME: cn-beijing
      MINIO_DEFAULT_BUCKETS: opencsg-server-lfs:public,opencsg-public-resource:public,opencsg-portal-storage:public
    ports:
      - "127.0.0.1:${CSGHUB_DEV_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${CSGHUB_DEV_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    restart: unless-stopped
    networks:
      - csghub-dev

  gitaly:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/gitaly:v16.4.6
    command:
      - bash
      - -c
      - >-
        mkdir -p /home/git/repositories /home/git/hooks &&
        rm -rf /srv/gitlab-shell/hooks/* &&
        touch /srv/gitlab-shell/.gitlab_shell_secret &&
        exec /usr/bin/env GITALY_CONFIG_FILE=/home/gitaly.config.toml /scripts/process-wrapper
    environment:
      GITALY_CONFIG_FILE: /home/gitaly.config.toml
    user: root
    healthcheck:
      test: ["CMD-SHELL", "ss -tulnp '( sport = :18075 )' | grep -q gitaly"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${CSGHUB_DEV_GITALY_PORT:-18075}:18075"
    volumes:
      - gitaly-repositories:/home/git/repositories
      - gitaly-hooks:/home/git/hooks
      - ./deploy/dev/gitaly.config.toml:/home/gitaly.config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - csghub-dev

  natsmaster:
    image: nats:2.10.16
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:${CSGHUB_DEV_NATS_PORT:-14222}:4222"
      - "127.0.0.1:${CSGHUB_DEV_NATS_MONITOR_PORT:-18222}:8222"
    volumes:
      - ./deploy/dev/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data/jetstream
    restart: unless-stopped
    networks:
      - csghub-dev

  temporal:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/temporalio/auto-setup:1.25.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE_RETENTION: 7d
    ports:
      - "127.0.0.1:${CSGHUB_DEV_TEMPORAL_PORT:-17233}:7233"
    restart: unless-stopped
    networks:
      - csghub-dev

  casdoor:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/casbin/casdoor:v1.733.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
    ports:
      - "127.0.0.1:${CSGHUB_DEV_CASDOOR_PORT:-18000}:8000"
    volumes:
      - ./deploy/dev/casdoor:/conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - csghub-dev

  temporal-ui:
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/temporalio/ui:2.30.3
    profiles: ["tools"]
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8090
    ports:
      - "127.0.0.1:${CSGHUB_DEV_TEMPORAL_UI_PORT:-18180}:8080"
    restart: unless-stopped
    networks:
      - csghub-dev

  server:
    image: csghub-local:dev
    build:
      context: .
      dockerfile: deploy/dev/Dockerfile.local
    working_dir: /app
    entrypoint: [/app/bin/csghub-server]
    command: [--config=/config/server.docker.toml, start, server]
    volumes:
      - ./deploy/dev:/config:ro
      - ../csghub-server/configs:/app/configs:ro
      - ../csghub-server/docker:/app/docker:ro
      - app-data:/app/data
    environment:
      GIN_MODE: release
    restart: unless-stopped
    network_mode: host

  user:
    extends: server
    command: [--config=/config/server.docker.toml, user, launch]

  dataviewer:
    extends: server
    command: [--config=/config/server.docker.toml, dataviewer, launch]

  portal:
    image: csghub-local:dev
    working_dir: /app
    entrypoint: [/app/bin/csghub-portal]
    command: [start, server]
    env_file: [./deploy/dev/portal.env]
    restart: unless-stopped
    network_mode: host

networks:
  csghub-dev:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  gitaly-repositories:
  gitaly-hooks:
  nats-data:
  app-data:
