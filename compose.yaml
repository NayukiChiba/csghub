services:
  csghub-init:
    image: ${CSGHUB_IMAGE:-registry.opencsg.com/opencsghq/omnibus-csghub:v2.6.0-ce}
    entrypoint: ['/bin/sh', '-c']
    command:
      - install -d -o 1001 -g 1001 -m 0755 /var/opt/csghub/casdoor/logs
    volumes:
      - ${CSGHUB_PERSISTENCE_ROOT:-./data/omnibus}/data:/var/opt/csghub
    restart: 'no'

  csghub:
    image: ${CSGHUB_IMAGE:-registry.opencsg.com/opencsghq/omnibus-csghub:v2.6.0-ce}
    depends_on:
      csghub-init:
        condition: service_completed_successfully
    environment:
      CSGHUB_PORTAL_STARHUB_PUBLIC_BASE_URL: "${CSGHUB_PUBLIC_URL:-}"
      CSGHUB_OMNIBUS_CONFIG: |
        csghub:
          external_url: "${CSGHUB_EXTERNAL_URL}"
    ports:
      - '80:80'
      - '2222:2222'
      - '8000:8000'
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ${CSGHUB_PERSISTENCE_ROOT:-./data/omnibus}/etc:/etc/csghub
      - ${CSGHUB_PERSISTENCE_ROOT:-./data/omnibus}/logs:/var/log/csghub
      - ${CSGHUB_PERSISTENCE_ROOT:-./data/omnibus}/data:/var/opt/csghub
      - ${CSGHUB_PERSISTENCE_ROOT:-./data/omnibus}/.kube:/etc/csghub/.kube:ro
      - ./config/bootstrap-temporal.sh:/usr/local/bin/bootstrap-temporal:ro
      - ./config/configure-portal-public-url.sh:/usr/local/bin/configure-portal-public-url:ro
    post_start:
      - command: /bin/sh /usr/local/bin/bootstrap-temporal
      - command: /bin/sh /usr/local/bin/configure-portal-public-url
    restart: always
    shm_size: '256m'
